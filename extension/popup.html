<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>TabNest Capture</title>
  </head>
  <body>
    <div class="brand">
      <span class="logo">✦</span>
      <span class="name">TabNest</span>
    </div>

    <section id="logged-out">
      <p class="hint">Connecte-toi une seule fois : l’extension capture ensuite tes pages toute seule.</p>
      <button id="google-btn" type="button" class="google">Continuer avec Google</button>
      <p class="or">ou avec un e-mail</p>
      <form id="login-form">
        <label for="email">E-mail</label>
        <input id="email" type="email" required placeholder="toi@exemple.fr" autocomplete="email" />
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password" />
        <button type="submit" id="login-btn">Se connecter</button>
      </form>
      <p id="error" class="error" hidden></p>
    </section>

    <section id="logged-in" hidden>
      <div id="page-card" class="page" hidden>
        <img id="page-favicon" alt="" />
        <div class="page-text">
          <p id="page-title" class="page-title"></p>
          <p id="page-host" class="hint"></p>
        </div>
      </div>

      <p id="save-state" class="hint"></p>

      <p class="label">Ranger cette page dans</p>
      <div class="reasons" role="group" aria-label="Ranger dans une étagère">
        <button type="button" data-reason="remember">À retenir</button>
        <button type="button" data-reason="finish">À finir</button>
        <button type="button" data-reason="explore">Piste</button>
        <button type="button" data-reason="decide">À décider</button>
      </div>

      <div class="row">
        <button id="pin-btn" type="button" class="ghost">Épingler</button>
        <select id="group-select" aria-label="Projet">
          <option value="">Aucun projet</option>
        </select>
      </div>

      <p id="feedback" class="status" hidden></p>

      <div class="setting">
        <label class="switch">
          <input id="auto-close" type="checkbox" />
          Fermer automatiquement les onglets expirés
        </label>
        <p class="hint">
          Les pages restent dans TabNest ; seuls les onglets expirés, inactifs et non épinglés
          sont fermés.
        </p>
        <p id="auto-close-status" class="last"></p>
      </div>

      <div class="import">
        <p class="label">Ne pas démarrer à zéro</p>
        <div class="row">
          <button id="import-history" type="button" class="ghost">Importer mon historique</button>
          <button id="import-bookmarks" type="button" class="ghost">Importer mes favoris</button>
        </div>
        <p id="import-status" class="hint"></p>
      </div>

      <p id="account" class="account"></p>
      <p id="count" class="last"></p>
      <p id="last" class="last"></p>

      <div class="row">
        <button id="capture-btn" type="button" class="ghost">Capturer cette page</button>
        <button id="refresh-btn" type="button" class="ghost">Actualiser</button>
      </div>
      <button id="logout-btn" type="button" class="ghost">Se déconnecter</button>
      <a href="https://tabnest-alb.pages.dev/" target="_blank" rel="noreferrer" class="link">Ouvrir TabNest →</a>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>

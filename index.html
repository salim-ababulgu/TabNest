            "mainEntity": [
              {
                "@type": "Question",
                "name": "Filnest lit-il le contenu de mes pages ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Non. Seules les métadonnées publiques sont enregistrées : adresse, titre, icône du site, image de partage et couleur dominante. Aucune capture d'écran, aucun texte de page."
                }
              },
              {
                "@type": "Question",
                "name": "Où sont stockées mes données ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Dans votre compte, sur notre base de données (Supabase). Chaque utilisateur ne peut accéder qu'à ses propres pages : le cloisonnement est appliqué au niveau de la base elle-même."
                }
              },
              {
                "@type": "Question",
                "name": "Puis-je désactiver la capture automatique ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Oui, à tout moment depuis le tableau de bord. L'extension arrête immédiatement d'enregistrer vos visites, sans désinstallation."
                }
              },
              {
                "@type": "Question",
                "name": "Que deviennent les pages expirées ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Elles basculent dans les archives et ne sont plus affichées. Vous pouvez les supprimer définitivement à tout moment, et la suppression de votre compte efface toutes vos données."
                }
              },
              {
                "@type": "Question",
                "name": "Pourquoi pas une extension de gestion d'onglets ou de favoris ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Les extensions classiques gardent des sessions ou des favoris sur un seul navigateur. Filnest garde la page avec la raison de la garder et une durée de vie, puis la retrouve sur tous vos appareils grâce à votre compte."
                }
              },
              {
                "@type": "Question",
                "name": "Je change d'ordinateur : je retrouve mes pages ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Oui. Vos pages sont dans votre compte, pas dans le navigateur : connectez-vous depuis un autre appareil et elles sont là."
                }
              },
              {
                "@type": "Question",
                "name": "Quelles permissions l'extension demande-t-elle ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Lire l'adresse, le titre, l'icône et la couleur de la page active, et stocker votre session. Elle ne lit jamais le contenu des pages, ne voit pas vos mots de passe et ne lit pas vos autres onglets. Deux permissions optionnelles (historique, favoris) ne servent qu'à l'import que vous déclenchez vous-même, et peuvent être refusées."
                }
              },
              {
                "@type": "Question",
                "name": "Que se passe-t-il si je ferme un onglet ou si le navigateur redémarre ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Rien n'est perdu au moment de la fermeture : la page est déjà enregistrée. Elle reste disponible jusqu'à la fin de sa durée de vie, puis dans les archives, restaurables. C'est l'inverse d'une session qui dépend du navigateur."
                }
              },
              {
                "@type": "Question",
                "name": "Filnest fonctionne-t-il sur mobile ?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "L'extension est disponible sur les navigateurs de bureau (Chrome, Edge). Les navigateurs mobiles limitent les extensions ; nous travaillons sur une solution pour téléphone."
                }
              },
